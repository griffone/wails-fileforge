version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "fileforge-desktop"
  BIN_DIR: "bin"
  CLI_SOURCE: "./cmd/fileforge-cli"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  build:cli:
    desc: Builds the headless CLI for the host
    summary: Builds bin/fileforge-cli, the headless CLI that never boots Wails
    cmds:
      - go build -buildvcs=false -ldflags="{{.VERSION_LDFLAGS}}" -o {{.BIN_DIR}}/fileforge-cli {{.CLI_SOURCE}}
    vars:
      VERSION_LDFLAGS:
        sh: GOOS= GOARCH= CGO_ENABLED=0 go run {{.ROOT_DIR}}/scripts/versionflags

  build:windows:
    desc: Build the complete Windows x64 installer and portable ZIP (cross-build)
    summary: Builds the complete Windows x64 installer and portable ZIP (cross-build from Linux)
    cmds:
      - ./scripts/build-windows.sh

  checksums:
    desc: Regenerate bin/SHA256SUMS over the release artifacts
    summary: |
      Writes bin/SHA256SUMS for every release artifact that exists in bin/: the
      Windows installer and portable ZIP, the Linux AppImage, the deb, rpm and
      Arch packages, and the headless CLI. Run it after signing: signing
      changes the file bytes, so a checksum computed before signing is wrong.
    dir: "{{.BIN_DIR}}"
    cmds:
      - |
        set -e
        : > SHA256SUMS
        for artifact in \
          fileforge-desktop-amd64-installer.exe \
          fileforge-desktop-windows-amd64.zip \
          fileforge-desktop-x86_64.AppImage \
          fileforge-desktop.deb \
          fileforge-desktop.rpm \
          fileforge-desktop.pkg.tar.zst \
          fileforge-cli \
          fileforge-cli.exe; do
          if [ -f "$artifact" ]; then
            sha256sum "$artifact" >> SHA256SUMS
          fi
        done
        if [ ! -s SHA256SUMS ]; then
          echo "no release artifacts found in $(pwd)" >&2
          exit 1
        fi
        cat SHA256SUMS

  package:
    summary: Build the optimized Windows installer/portable ZIP and Linux AppImage
    cmds:
      - task: package-windows
      - task: package-linux
      # Regenerate once more so the AppImage checksum is fresh too.
      - task: checksums

  package-windows:
    summary: Build the optimized Windows installer and portable ZIP (cross-build from Linux)
    cmds:
      - task: build:windows
      - task: checksums

  package-linux:
    summary: Build the optimized Linux AppImage
    cmds:
      - task: linux:create:appimage

  package-native:
    summary: Package the current OS with the native Wails task
    cmds:
      - task: "{{OS}}:package"

  package-linux-full:
    summary: Build the full Linux package set (AppImage, deb, rpm, aur)
    cmds:
      - task: linux:package

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  verify:
    desc: Builds, vets, and tests the Go backend
    summary: Runs the backend verification gate
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./... -count=1

  verify:frontend:
    desc: Builds and tests the Angular frontend
    summary: Runs the frontend verification gate with a resolved Chromium binary
    cmds:
      - ./scripts/verify-frontend.sh

  verify:all:
    desc: Runs backend and frontend verification
    summary: Runs the complete verification gate
    deps:
      - verify
      - "verify:frontend"
