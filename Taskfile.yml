version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "fileforge-desktop"
  BIN_DIR: "bin"
  CLI_SOURCE: "./cmd/fileforge-cli"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  build:cli:
    desc: Builds the headless CLI for the host
    summary: Builds bin/fileforge-cli, the headless CLI that never boots Wails
    cmds:
      - go build -buildvcs=false -o {{.BIN_DIR}}/fileforge-cli {{.CLI_SOURCE}}

  build:windows:
    desc: Build the complete Windows x64 installer and portable ZIP (cross-build)
    summary: Builds the complete Windows x64 installer and portable ZIP (cross-build from Linux)
    cmds:
      - ./scripts/build-windows.sh

  package:
    summary: Build the optimized Windows installer/portable ZIP and Linux AppImage
    cmds:
      - task: package-windows
      - task: package-linux

  package-windows:
    summary: Build the optimized Windows installer and portable ZIP (cross-build from Linux)
    cmds:
      - task: build:windows

  package-linux:
    summary: Build the optimized Linux AppImage
    cmds:
      - task: linux:create:appimage

  package-native:
    summary: Package the current OS with the native Wails task
    cmds:
      - task: "{{OS}}:package"

  package-linux-full:
    summary: Build the full Linux package set (AppImage, deb, rpm, aur)
    cmds:
      - task: linux:package

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  verify:
    desc: Builds, vets, and tests the Go backend
    summary: Runs the backend verification gate
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./... -count=1

  verify:frontend:
    desc: Builds and tests the Angular frontend
    summary: Runs the frontend verification gate with a resolved Chromium binary
    cmds:
      - ./scripts/verify-frontend.sh

  verify:all:
    desc: Runs backend and frontend verification
    summary: Runs the complete verification gate
    deps:
      - verify
      - "verify:frontend"
