version: "3"

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

vars:
  APP_NAME: "fileforge-desktop"
  BIN_DIR: "bin"
  CLI_SOURCE: "./cmd/fileforge-cli"
  VITE_PORT: "{{.WAILS_VITE_PORT | default 9245}}"
  # Release assets, in publication order. Shared by checksums, signing,
  # verification and the dist assembly so a new artifact is added once.
  RELEASE_ARTIFACTS: >-
    fileforge-desktop-amd64-installer.exe
    fileforge-desktop-windows-amd64.zip
    fileforge-desktop-x86_64.AppImage
    fileforge-desktop.deb
    fileforge-desktop.rpm
    fileforge-desktop.pkg.tar.zst
    fileforge-cli
    fileforge-cli.exe

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  build:cli:
    desc: Builds the headless CLI for the host
    summary: Builds bin/fileforge-cli, the headless CLI that never boots Wails
    cmds:
      - go build -buildvcs=false -ldflags="{{.VERSION_LDFLAGS}}" -o {{.BIN_DIR}}/fileforge-cli {{.CLI_SOURCE}}
    vars:
      VERSION_LDFLAGS:
        sh: GOOS= GOARCH= CGO_ENABLED=0 go run {{.ROOT_DIR}}/scripts/versionflags

  build:windows:
    desc: Build the complete Windows x64 installer and portable ZIP (cross-build)
    summary: Builds the complete Windows x64 installer and portable ZIP (cross-build from Linux)
    cmds:
      - ./scripts/build-windows.sh

  checksums:
    desc: Regenerate bin/SHA256SUMS over the release artifacts
    summary: |
      Writes bin/SHA256SUMS for every release artifact that exists in bin/: the
      Windows installer and portable ZIP, the Linux AppImage, the deb, rpm and
      Arch packages, and the headless CLI. Run it after signing: signing
      changes the file bytes, so a checksum computed before signing is wrong.
    dir: "{{.BIN_DIR}}"
    cmds:
      - |
        set -e
        : > SHA256SUMS
        for artifact in {{.RELEASE_ARTIFACTS}}; do
          if [ -f "$artifact" ]; then
            sha256sum "$artifact" >> SHA256SUMS
          fi
        done
        if [ ! -s SHA256SUMS ]; then
          echo "no release artifacts found in $(pwd)" >&2
          exit 1
        fi
        cat SHA256SUMS

  release:keygen:
    desc: Generate an offline ed25519 release-signing keypair
    summary: |
      Writes <OUT>.key (mode 0600) and <OUT>.pub outside the repository and
      prints the base64 public key. Keep the private key offline: a new key
      invalidates every signature made with the old one.

        task release:keygen OUT=~/.config/fileforge/release
        export FILEFORGE_UPDATE_PUBKEY="$(cat ~/.config/fileforge/release.pub)"
    requires:
      vars: [OUT]
    cmds:
      - go run ./scripts/releasesign -keygen -out "{{.OUT}}"

  release:sign:
    desc: Write a detached ed25519 .sig for every release artifact in bin
    summary: |
      Signs every existing release artifact with the private key at KEY and
      writes <artifact>.sig next to it. The key must live outside the
      repository; the task refuses one that does not.

        task release:sign KEY=~/.config/fileforge/release.key
    requires:
      vars: [KEY]
    cmds:
      - |
        set -e
        artifacts=""
        for artifact in {{.RELEASE_ARTIFACTS}}; do
          if [ -f "{{.BIN_DIR}}/$artifact" ]; then
            artifacts="$artifacts {{.BIN_DIR}}/$artifact"
          fi
        done
        if [ -z "$artifacts" ]; then
          echo "release:sign: no release artifacts found in {{.BIN_DIR}}/" >&2
          exit 1
        fi
        # Intentional word splitting: the list is built from RELEASE_ARTIFACTS.
        go run ./scripts/releasesign -sign $artifacts -key "{{.KEY}}"

  release:verify:
    desc: Verify every release artifact signature in bin
    summary: |
      Checks <artifact>.sig against the base64 public key in PUBKEY and exits
      non-zero on the first mismatch. Run it before publishing.

        task release:verify PUBKEY="$(cat ~/.config/fileforge/release.pub)"
    requires:
      vars: [PUBKEY]
    cmds:
      - |
        set -e
        verified=0
        for artifact in {{.RELEASE_ARTIFACTS}}; do
          if [ -f "{{.BIN_DIR}}/$artifact" ]; then
            go run ./scripts/releasesign \
              -verify "{{.BIN_DIR}}/$artifact" \
              -sig "{{.BIN_DIR}}/$artifact.sig" \
              -pubkey "{{.PUBKEY}}"
            verified=$((verified + 1))
          fi
        done
        if [ "$verified" -eq 0 ]; then
          echo "release:verify: no release artifacts found in {{.BIN_DIR}}/" >&2
          exit 1
        fi

  release:dist:
    desc: Assemble signed release assets into dist/<version> for gh release create
    summary: |
      Regenerates SHA256SUMS, signs every release artifact, verifies every
      signature against PUBKEY, then copies the artifacts, their .sig files and
      SHA256SUMS into dist/<wails.json version>/. The directory is exactly what
      `gh release create` uploads.

        task release:dist KEY=~/.config/fileforge/release.key \
          PUBKEY="$(cat ~/.config/fileforge/release.pub)"
    requires:
      vars: [KEY, PUBKEY]
    cmds:
      - task: checksums
      - task: release:sign
        vars:
          KEY: "{{.KEY}}"
      - task: release:verify
        vars:
          PUBKEY: "{{.PUBKEY}}"
      - |
        set -e
        version=$(sed -n 's/^  "version": "\([^"]*\)".*/\1/p' wails.json | head -n 1)
        if [ -z "$version" ]; then
          echo "release:dist: could not read the version from wails.json" >&2
          exit 1
        fi
        out="dist/$version"
        rm -rf "$out"
        mkdir -p "$out"
        cp "{{.BIN_DIR}}/SHA256SUMS" "$out/"
        for artifact in {{.RELEASE_ARTIFACTS}}; do
          if [ -f "{{.BIN_DIR}}/$artifact" ]; then
            cp "{{.BIN_DIR}}/$artifact" "{{.BIN_DIR}}/$artifact.sig" "$out/"
          fi
        done
        echo "release assets in $out:"
        ls -1 "$out"

  package:
    summary: Build the optimized Windows installer/portable ZIP and Linux AppImage
    cmds:
      - task: package-windows
      - task: package-linux
      # Regenerate once more so the AppImage checksum is fresh too.
      - task: checksums

  package-windows:
    summary: Build the optimized Windows installer and portable ZIP (cross-build from Linux)
    cmds:
      - task: build:windows
      - task: checksums

  package-linux:
    summary: Build the optimized Linux AppImage
    cmds:
      - task: linux:create:appimage

  package-native:
    summary: Package the current OS with the native Wails task
    cmds:
      - task: "{{OS}}:package"

  package-linux-full:
    summary: Build the full Linux package set (AppImage, deb, rpm, aur)
    cmds:
      - task: linux:package

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  verify:
    desc: Builds, vets, and tests the Go backend
    summary: Runs the backend verification gate
    cmds:
      - go build ./...
      - go vet ./...
      - go test ./... -count=1

  verify:frontend:
    desc: Builds and tests the Angular frontend
    summary: Runs the frontend verification gate with a resolved Chromium binary
    cmds:
      - ./scripts/verify-frontend.sh

  verify:all:
    desc: Runs backend and frontend verification
    summary: Runs the complete verification gate
    deps:
      - verify
      - "verify:frontend"
